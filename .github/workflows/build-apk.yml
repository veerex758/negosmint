name: Build APK

on:
  workflow_dispatch:  # Change to 'push' if you want automatic builds on every commit

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true
          cache-dependency-path: pubspec.lock
          gradle: wrapper   # This forces the project Gradle wrapper and fixes the QName error

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-pub

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: negosmint-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          overwrite: true