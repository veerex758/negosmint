name: Build APK

on:
  workflow_dispatch:  # or: push, pull_request if you want automatic builds

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          flutter-version: '3.24.5'  # or keep 'stable' if you prefer latest stable

      - name: Get dependencies
        run: flutter pub get

      # Optional but recommended: build for multiple architectures (APK + AAB for Play Store)
      - name: Build APK
        run: flutter build apk --release

      # NEW: Upload the actual built APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: negosmint-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          overwrite: true