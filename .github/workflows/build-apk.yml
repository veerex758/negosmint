name: Build APK

on:
  workflow_dispatch:  # Change to 'push' if you want automatic builds on every commit

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Ensures we always get the latest commits (optional but helpful)

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'           # Exact version that resolves the Gradle QName issue
          cache: true
          cache-dependency-path: pubspec.lock # Critical fix for the groovy.xml.QName error
          # flutter-version: stable             # Uncomment only if you prefer always-latest stable

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release --no-pub

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: negosmint-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          overwrite: true