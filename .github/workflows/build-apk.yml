name: Setup NegosMint Flutter Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter project
        run: |
          flutter create \
            --org com.negosmint \
            --project-name negosmint \
            .

      - name: Configure Git
        run: |
          git config user.name "NegosMint Builder"
          git config user.email "actions@github.com"

      - name: Commit Flutter project
        run: |
          git add .
          git commit -m "Create NegosMint Flutter project" || echo "Nothing to commit"
          git push origin HEAD:main
